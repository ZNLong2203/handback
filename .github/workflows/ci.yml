# Every push and pull request: lint, types and unit tests in one job, and the
# browser test of a whole rental in a second job that runs alongside it. Both
# run in demo mode, so no secrets are needed and the workflow references none.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to the same branch or pull request replaces the running check;
  # every commit on main keeps its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # tsc needs the route types (PageProps, RouteContext) that Next generates.
      - name: Generate Next.js route types
        run: npx next typegen
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: End-to-end test (demo mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      # playwright.config.ts builds the app and starts it with DEMO_MODE=true
      # and an in-memory database before the test runs.
      - name: Run the end-to-end test
        run: npm run e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
